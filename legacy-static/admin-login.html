<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Tirupati Jewellers</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #f8f5ef;
            box-sizing: border-box;
        }

        .admin-login-box {
            width: min(430px, 100%);
            padding: 50px 40px;
            background: white;
            border: 1px solid #e5dfd4;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-logo h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 4px;
            font-weight: 500;
        }

        .admin-logo p {
            margin: 8px 0 0;
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 5px;
            color: #b89552;
        }

        .admin-title {
            margin-bottom: 30px;
        }

        .admin-title span {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: #8d6d32;
            margin-bottom: 10px;
        }

        .admin-title h2 {
            margin: 0;
            font-size: 34px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d8d0c5;
            background: #fff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #b89552;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            margin-top: 10px;
            border: none;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: #b89552;
        }

        .login-error {
            display: none;
            margin-top: 18px;
            padding: 12px;
            background: #f8eaea;
            color: #a33;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-align: center;
        }

        .back-home {
            display: block;
            margin-top: 25px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #777;
            text-decoration: none;
        }

        .back-home:hover {
            color: #b89552;
        }

        .security-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #999;
        }

        @media (max-width: 500px) {

            .admin-login-page {
                padding: 15px;
            }

            .admin-login-box {
                padding: 40px 25px;
            }

            .admin-title h2 {
                font-size: 29px;
            }

        }

    </style>

</head>


<body>


<main class="admin-login-page">


    <div class="admin-login-box">


        <!-- LOGO -->

        <div class="admin-logo">

            <h1>TIRUPATI</h1>

            <p>JEWELLERS</p>

        </div>


        <!-- TITLE -->

        <div class="admin-title">

            <span>
                ADMINISTRATION
            </span>

            <h2>
                Welcome back.
            </h2>

        </div>


        <!-- LOGIN FORM -->

        <form id="adminLoginForm">


            <div class="form-group">

                <label for="username">
                    ADMIN USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                SIGN IN
            </button>


            <div
                id="loginError"
                class="login-error"
            >
                Invalid username or password.
            </div>


        </form>


        <!-- BACK -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to website
        </a>


        <div class="security-note">

            Tirupati Jewellers Administration

        </div>


    </div>


</main>


<script>

    /*
    ==========================================
    TEMPORARY ADMIN LOGIN
    ==========================================
    */

    const ADMIN_USERNAME = "admin";

    const ADMIN_PASSWORD = "123456";


    document
        .getElementById("adminLoginForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const error =
                    document
                        .getElementById("loginError");


                /*
                ==========================
                CHECK LOGIN
                ==========================
                */

                if (
                    username === ADMIN_USERNAME &&
                    password === ADMIN_PASSWORD
                ) {


                    /*
                    IMPORTANT:
                    Use sessionStorage everywhere.
                    */

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    /*
                    GO DIRECTLY TO ADMIN PAGE
                    */

                    window.location.href =
                        "admin.html";


                } else {


                    error.style.display =
                        "block";


                }

            }
        );

</script>


</body>

</html>
