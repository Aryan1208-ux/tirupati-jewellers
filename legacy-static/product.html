<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | Tirupati Jewellers</title>

    <meta
        name="description"
        content="Discover timeless jewellery from Tirupati Jewellers."
    >

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =====================================================
           PRODUCT PAGE
           ===================================================== */

        .product-page {
            padding: 150px 0 100px;
            background: var(--cream);
            min-height: 100vh;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 80px;
            align-items: center;
        }

        /* ================= IMAGE ================= */

        .product-image-box {
            position: relative;
            background: #eee9df;
            overflow: hidden;
        }

        .product-image-box img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            transition: transform 0.7s ease;
        }

        .product-image-box:hover img {
            transform: scale(1.04);
        }

        /* ================= INFO ================= */

        .product-info {
            max-width: 550px;
        }

        .product-badge {
            display: inline-block;
            padding: 8px 13px;
            margin-bottom: 22px;
            background: white;
            border: 1px solid var(--gold-light);
            color: var(--gold-dark);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .product-info .eyebrow {
            margin-bottom: 12px;
        }

        .product-info h1 {
            font-size: clamp(42px, 5vw, 65px);
            line-height: 1;
            font-weight: 400;
            color: var(--black);
            margin-bottom: 22px;
        }

        .product-price {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            color: var(--text);
            margin-bottom: 28px;
        }

        .product-description {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-light);
            max-width: 500px;
            margin-bottom: 32px;
        }

        /* ================= QUANTITY ================= */

        .quantity-title {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            width: fit-content;
            border: 1px solid var(--border);
            background: white;
            margin-bottom: 25px;
        }

        .quantity-box button {
            width: 45px;
            height: 45px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s ease;
        }

        .quantity-box button:hover {
            background: var(--gold);
            color: white;
        }

        .quantity-box span {
            width: 45px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        /* ================= ACTIONS ================= */

        .product-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }

        .add-cart-btn {
            flex: 1;
            min-height: 55px;
            border: none;
            background: var(--black);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.7px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .add-cart-btn:hover {
            background: var(--gold);
        }

        .buy-now-btn {
            flex: 1;
            min-height: 55px;
            border: 1px solid var(--black);
            background: transparent;
            color: var(--black);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.7px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .buy-now-btn:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: white;
        }

        /* ================= PRODUCT FEATURES ================= */

        .product-features {
            border-top: 1px solid var(--border);
            padding-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .product-feature {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            color: var(--text-light);
            line-height: 1.5;
        }

        .product-feature strong {
            display: block;
            color: var(--text);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* ================= BACK LINK ================= */

        .back-shop {
            display: inline-block;
            margin-top: 55px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-dark);
            transition: 0.3s ease;
        }

        .back-shop:hover {
            color: var(--black);
        }

        /* ================= NOT FOUND ================= */

        .not-found {
            text-align: center;
            padding: 130px 20px;
        }

        .not-found h1 {
            font-size: 50px;
            font-weight: 400;
            margin-bottom: 15px;
        }

        .not-found p {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .product-detail {
                grid-template-columns: 1fr;
                gap: 50px;
            }

            .product-info {
                max-width: none;
            }

        }

        @media (max-width: 650px) {

            .product-page {
                padding: 110px 0 70px;
            }

            .product-info h1 {
                font-size: 42px;
            }

            .product-actions {
                flex-direction: column;
            }

            .product-features {
                grid-template-columns: 1fr;
                gap: 20px;
            }

        }

    </style>
</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">

                <span class="logo-main">
                    TIRUPATI
                </span>

                <span class="logo-sub">
                    JEWELLERS
                </span>

            </a>


            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="shop.html">
                    Shop
                </a>

                <a href="index.html#collections">
                    Collections
                </a>

                <a href="index.html#about">
                    About
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

            </nav>


            <div class="nav-actions">

                <a
                    href="cart.html"
                    class="cart-button"
                    aria-label="Shopping Cart"
                >
                    🛒

                    <span id="cart-count">
                        0
                    </span>

                </a>

            </div>

        </div>

    </header>


    <!-- ================= PRODUCT ================= -->

    <main class="product-page">

        <div class="container">

            <div id="product-container">

                <!-- Product loads automatically -->

            </div>

        </div>

    </main>


    <!-- ================= PRODUCT DATA ================= -->

    <script src="js/product.js"></script>


    <script>

        const params =
            new URLSearchParams(window.location.search);

        const productId =
            Number(params.get("id"));

        const product =
            products.find(
                item => item.id === productId
            );

        const container =
            document.getElementById(
                "product-container"
            );


        /* ================= PRODUCT NOT FOUND ================= */

        if (!product) {

            container.innerHTML = `

                <div class="not-found">

                    <h1>
                        Product Not Found
                    </h1>

                    <p>
                        Sorry, this jewellery piece
                        could not be found.
                    </p>

                    <a
                        href="shop.html"
                        class="btn btn-primary"
                    >
                        RETURN TO SHOP
                    </a>

                </div>

            `;

        }


        /* ================= PRODUCT FOUND ================= */

        else {

            let quantity = 1;


            container.innerHTML = `

                <div class="product-detail">


                    <!-- IMAGE -->

                    <div class="product-image-box">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    </div>


                    <!-- PRODUCT INFORMATION -->

                    <div class="product-info">


                        <div class="product-badge">

                            ${product.badge}

                        </div>


                        <p class="eyebrow">

                            ${product.category}

                        </p>


                        <h1>

                            ${product.name}

                        </h1>


                        <div class="product-price">

                            ₹${product.price.toLocaleString("en-IN")}

                        </div>


                        <p class="product-description">

                            Discover timeless elegance with this
                            beautifully crafted piece from
                            Tirupati Jewellers. Designed to bring
                            sophistication, beauty and luxury to
                            your most memorable occasions.

                        </p>


                        <!-- QUANTITY -->

                        <p class="quantity-title">

                            Quantity

                        </p>


                        <div class="quantity-box">

                            <button
                                id="minus"
                                type="button"
                                aria-label="Decrease quantity"
                            >
                                −
                            </button>


                            <span id="quantity">
                                1
                            </span>


                            <button
                                id="plus"
                                type="button"
                                aria-label="Increase quantity"
                            >
                                +
                            </button>

                        </div>


                        <!-- BUTTONS -->

                        <div class="product-actions">

                            <button
                                class="add-cart-btn"
                                id="addCart"
                                type="button"
                            >
                                ADD TO CART
                            </button>


                            <button
                                class="buy-now-btn"
                                id="buyNow"
                                type="button"
                            >
                                BUY NOW
                            </button>

                        </div>


                        <!-- FEATURES -->

                        <div class="product-features">

                            <div class="product-feature">

                                <strong>
                                    Quality
                                </strong>

                                Premium craftsmanship

                            </div>


                            <div class="product-feature">

                                <strong>
                                    Packaging
                                </strong>

                                Elegant gift packaging

                            </div>


                            <div class="product-feature">

                                <strong>
                                    Service
                                </strong>

                                Trusted customer support

                            </div>

                        </div>


                        <a
                            href="shop.html"
                            class="back-shop"
                        >
                            ← Continue Shopping
                        </a>


                    </div>

                </div>

            `;


            /* ================= QUANTITY ================= */

            document
                .getElementById("plus")
                .addEventListener(
                    "click",
                    () => {

                        quantity++;

                        document
                            .getElementById("quantity")
                            .textContent = quantity;

                    }
                );


            document
                .getElementById("minus")
                .addEventListener(
                    "click",
                    () => {

                        if (quantity > 1) {
                            quantity--;
                        }

                        document
                            .getElementById("quantity")
                            .textContent = quantity;

                    }
                );


            /* ================= ADD TO CART ================= */

            document
                .getElementById("addCart")
                .addEventListener(
                    "click",
                    () => {

                        let cart =
                            JSON.parse(
                                localStorage.getItem("cart")
                            ) || [];


                        const existingProduct =
                            cart.find(
                                item =>
                                    item.id === product.id
                            );


                        if (existingProduct) {

                            existingProduct.quantity += quantity;

                        }

                        else {

                            cart.push({

                                id: product.id,

                                name: product.name,

                                price: product.price,

                                image: product.image,

                                quantity: quantity

                            });

                        }


                        localStorage.setItem(
                            "cart",
                            JSON.stringify(cart)
                        );


                        alert(
                            product.name +
                            " added to your cart! 🛍️"
                        );


                        /* Update cart count */

                        const cartCount =
                            document.getElementById(
                                "cart-count"
                            );

                        if (cartCount) {

                            const totalItems =
                                cart.reduce(
                                    (total, item) =>
                                        total +
                                        (item.quantity || 1),
                                    0
                                );

                            cartCount.textContent =
                                totalItems;

                        }

                    }
                );


            /* ================= BUY NOW ================= */

            document
                .getElementById("buyNow")
                .addEventListener(
                    "click",
                    () => {

                        let cart =
                            JSON.parse(
                                localStorage.getItem("cart")
                            ) || [];


                        const existingProduct =
                            cart.find(
                                item =>
                                    item.id === product.id
                            );


                        if (existingProduct) {

                            existingProduct.quantity += quantity;

                        }

                        else {

                            cart.push({

                                id: product.id,

                                name: product.name,

                                price: product.price,

                                image: product.image,

                                quantity: quantity

                            });

                        }


                        localStorage.setItem(
                            "cart",
                            JSON.stringify(cart)
                        );


                        window.location.href =
                            "checkout.html";

                    }
                );

        }

    </script>


    <!-- CART SCRIPT -->

    <script src="js/cart.js"></script>

</body>
</html>
